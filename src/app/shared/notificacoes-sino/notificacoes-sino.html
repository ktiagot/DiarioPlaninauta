<div class="notificacoes-sino">
  <button
    mat-icon-button
    type="button"
    class="notificacoes-sino__btn"
    aria-label="Notificações"
    matTooltip="Notificações"
    [matBadge]="naoLidas() > 0 ? naoLidas() : null"
    matBadgeColor="warn"
    matBadgeSize="small"
    [matBadgeHidden]="naoLidas() === 0"
    (click)="toggleDropdown()"
  >
    <mat-icon>notifications</mat-icon>
  </button>

  @if (dropdownAberto()) {
    <div class="notificacoes-sino__dropdown" role="menu" aria-label="Notificações">
      <div class="notificacoes-sino__header">
        <span class="notificacoes-sino__title">Notificações</span>
        @if (naoLidas() > 0) {
          <button
            type="button"
            class="notificacoes-sino__marcar-todas"
            (click)="marcarTodasComoLidas()"
          >
            Marcar todas como lidas
          </button>
        }
      </div>

      <div class="notificacoes-sino__lista">
        @if (carregando()) {
          <div class="notificacoes-sino__loading">Carregando...</div>
        } @else if (notificacoes().length === 0) {
          <div class="notificacoes-sino__empty">Nenhuma notificação</div>
        } @else {
          @for (notificacao of notificacoes(); track notificacao.id) {
            <button
              type="button"
              class="notificacoes-sino__item"
              [class.notificacoes-sino__item--nao-lida]="!notificacao.lida"
              (click)="marcarComoLida(notificacao)"
              role="menuitem"
            >
              @if (!notificacao.lida) {
                <span class="notificacoes-sino__dot" aria-hidden="true"></span>
              }
              <div class="notificacoes-sino__content">
                <span class="notificacoes-sino__item-titulo">{{ notificacao.titulo }}</span>
                <span class="notificacoes-sino__item-msg">{{ notificacao.mensagem }}</span>
              </div>
              <span class="notificacoes-sino__tempo">{{ tempoRelativo(notificacao.createdAt) }}</span>
            </button>
          }
        }
      </div>
    </div>
  }
</div>
